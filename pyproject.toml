[project]
name = "vision-engine"
version = "0.1.0"
description = "Real-time aerial object detection engine (core classifier first)"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["train", "optimize", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
